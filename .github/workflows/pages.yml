# 推送到 main 后自动打包并发布到 GitHub Pages。
# 线上发布的是 tools/build.mjs 生成的单文件 HTML（全部 JS/CSS 内联并压缩），
# 避免 48 个 ES 模块逐层串行请求，在高延迟网络下显著缩短首屏时间。
# 本地开发不受影响：仍可直接用静态服务器打开仓库根目录的 index.html。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install esbuild
        run: npm install --no-save --no-package-lock esbuild@0.28.2

      - name: Build single-file HTML
        run: node tools/build.mjs _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
